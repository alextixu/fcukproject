<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K 線高低點判斷(示意稿)</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --ink2:#5b6470; --ink3:#8a929c; --line:#e3e6ea;
  --low:#1d5fd1; --low-bg:#e8f0fd; --high:#c2620a; --high-bg:#fdf0e3;
  --up:#d6322f; --down:#13915a; --warn:#a66b00; --warn-bg:#fff6dc; --bad:#b42318; --bad-bg:#fdecea;
  --ok:#13915a; --ok-bg:#e5f5ec; --mute-bg:#eef0f3; --accent:#24324a;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--low)}
.mockbar{background:repeating-linear-gradient(135deg,#ffe58a 0 14px,#ffd84d 14px 28px);color:#4a3a00;text-align:center;font-weight:700;font-size:13px;padding:5px 12px;letter-spacing:.04em}
header{background:var(--accent);color:#fff}
.hwrap{max-width:1160px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand small{font-weight:500;opacity:.7;font-size:12px;margin-left:6px}
nav.top{display:flex;gap:4px}
nav.top a{color:#cfd7e6;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
nav.top a.on{background:rgba(255,255,255,.14);color:#fff}
.meta{margin-left:auto;font-size:12px;color:#cfd7e6;text-align:right;line-height:1.4}
.meta b{color:#fff}
main{max-width:1160px;margin:0 auto;padding:20px 20px 40px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.seg{display:inline-flex;background:var(--mute-bg);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.t-low{background:var(--low-bg);color:var(--low)}
.t-high{background:var(--high-bg);color:var(--high)}
.t-none{background:var(--mute-bg);color:var(--ink2)}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-wait{background:var(--mute-bg);color:var(--ink3)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-both{background:#ece8fb;color:#5a3fc0}
.sample{display:inline-block;font-size:11px;font-weight:700;color:#7a5a00;background:#fff1b8;border:1px dashed #d9b200;border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:2px}
.summary{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.summary .card{flex:1;min-width:150px;padding:12px 14px}
.kpi{font-size:24px;font-weight:800;line-height:1.2}
.kpi small{font-size:13px;font-weight:600;color:var(--ink2)}
.lbl{font-size:12px;color:var(--ink2)}
.listhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.listhead .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.pick{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.pick:first-of-type{border-top:0}
.pick:hover{background:#fafbfc}
.rank{font-weight:800;color:var(--ink3);text-align:center}
.nm{font-weight:700}
.nm span{color:var(--ink3);font-weight:500;font-size:13px;margin-left:4px}
.info{font-size:12.5px;color:var(--ink2);margin-top:2px}
.right{text-align:right}
.px{font-weight:700;font-variant-numeric:tabular-nums}
.chg{font-size:12.5px;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--down)}
.bar{height:6px;background:var(--mute-bg);border-radius:3px;overflow:hidden;margin-top:4px;width:100%}
.bar i{display:block;height:100%}
.more{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.more summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:600}
.minitable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.minitable td,.minitable th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.minitable th{color:var(--ink2);font-weight:600;font-size:12px}
.note{background:#f0f4fa;border:1px solid #d8e2f1;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#2b3a52}
.note b{color:#13213a}
.warnbox{background:var(--warn-bg);border:1px solid #f0d58a;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#5c4100}
.badbox{background:var(--bad-bg);border:1px solid #f3c4bf;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#7a1a12}
.mutebox{background:var(--mute-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.disc{font-size:12px;color:var(--ink3);border-top:1px solid var(--line);margin-top:24px;padding-top:12px;line-height:1.6}
/* search */
.search{position:relative;max-width:560px}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:var(--low)}
.search svg{position:absolute;left:13px;top:14px}
.ac{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:5;overflow:hidden;display:none}
.ac.show{display:block}
.ac div{padding:9px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.ac div:hover,.ac div.sel{background:#f2f5fa}
.ac .code{font-weight:700;width:44px}
.ac .sp{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--low)}
.verdict{display:flex;gap:16px;align-items:center}
.vicon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:none}
.vtitle{font-size:21px;font-weight:800;line-height:1.3}
.cls{display:grid;grid-template-columns:52px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:9px 8px;border-top:1px solid var(--line);text-align:left}
.cmp th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chartwrap{width:100%;overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 8px;border-top:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font-size:12px;color:var(--ink2);font-weight:600;background:#fafbfc}
.tblwrap{overflow-x:auto}
.label-demo{display:flex;gap:4px;align-items:flex-end;height:110px;margin:10px 0 4px}
.label-demo i{flex:1;background:#c9d2de;border-radius:3px 3px 0 0;position:relative}
.label-demo i.t{background:var(--low)}
.label-demo i.f{background:#8fa3c0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfcfd}
.step b{display:block;margin-bottom:4px}
.stack>*+*{margin-top:16px}
.bottomnav{display:none}
@media (max-width:760px){
  body{font-size:14.5px}
  .hwrap{padding:10px 14px;gap:6px}
  nav.top{display:none}
  .meta{margin-left:0;text-align:left;width:100%}
  main{padding:14px 12px 24px}
  .grid2,.grid4,.steps{grid-template-columns:1fr}
  .grid4.k2{grid-template-columns:1fr 1fr}
  .summary .card{min-width:calc(50% - 6px)}
  h1{font-size:19px}
  .verdict{align-items:flex-start}
  .vtitle{font-size:18px}
  .bottomnav{display:flex;position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;text-align:center;padding:8px 0 9px;font-size:11.5px;color:var(--ink3);text-decoration:none;font-weight:600}
  .bottomnav a svg{display:block;margin:0 auto 2px}
  .bottomnav a.on{color:var(--accent)}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="mockbar">⚠ 示意稿:畫面上的股票判斷、分數、K 線、追蹤成績都是假資料(標「研究結果」的數字除外)</div>
<header><div class="hwrap">
  <div class="brand">K 線高低點判斷<small>研究用・非投資建議</small></div>
  <nav class="top" id="topnav"></nav>
  <div class="meta">判斷基準日 <b>2026-11-02(一)收盤</b> ・ 資料更新 18:05<br>模型:訓練 2022–2025 ・ 股票池 TW100 73 檔</div>
</div></header>
<main id="app"></main>
<nav class="bottomnav" id="botnav"></nav>

<script>
/* ---------- 假資料產生 ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const POOL=`1301 台塑|1303 南亞|1326 台化|1477 聚陽|1504 東元|1590 亞德客-KY|1802 台玻|2002 中鋼|2049 上銀|2101 南港|2105 正新|2201 裕隆|2207 和泰車|2301 光寶科|2303 聯電|2308 台達電|2317 鴻海|2324 仁寶|2327 國巨|2330 台積電|2344 華邦電|2345 智邦|2347 聯強|2352 佳世達|2356 英業達|2357 華碩|2360 致茂|2368 金像電|2376 技嘉|2377 微星|2379 瑞昱|2382 廣達|2383 台光電|2395 研華|2408 南亞科|2454 聯發科|2474 可成|2603 長榮|2609 陽明|2615 萬海|2881 富邦金|2882 國泰金|2883 凱基金|2885 元大金|3008 大立光|3023 信邦|3034 聯詠|3037 欣興|3044 健鼎|3231 緯創|3443 創意|3533 嘉澤|3653 健策|3661 世芯-KY|3702 大聯大|3706 神達|3711 日月光投控|4938 和碩|4961 天鈺|5871 中租-KY|6239 力成|6409 旭隼|6415 矽力*-KY|6446 藥華藥|6505 台塑化|6669 緯穎|6770 力積電|8046 南電|8454 富邦媒|9904 寶成|9910 豐泰|9914 美利達|9945 潤泰新`.split('|').map(s=>{const[c,n]=s.split(' ');return{code:c,name:n,type:'pool'}});
const LOWVOL=`2412 中華電|3045 台灣大|2886 兆豐金|2912 統一超|1101 台泥|2884 玉山金|2892 第一金|4904 遠傳`.split('|').map(s=>{const[c,n]=s.split(' ');return{code:c,name:n,type:'lowvol'}});
const OUT=`2618 長榮航|2610 華航|1519 華城|2449 京元電子|1513 中興電|2542 興富發|2106 建大|1605 華新`.split('|').map(s=>{const[c,n]=s.split(' ');return{code:c,name:n,type:'out'}});
const NOSUP=`0050 元大台灣50|0056 元大高股息|6488 環球晶|5347 世界`.split('|').map(s=>{const[c,n]=s.split(' ');return{code:c,name:n,type:'nosup'}});
const ALL=[...POOL,...LOWVOL,...OUT,...NOSUP];
const BY=Object.fromEntries(ALL.map(s=>[s.code,s]));

// 今日判斷名單(假)
const r0=rng(7);
const shuffled=POOL.map(s=>[r0(),s]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const LOWSET=shuffled.slice(0,15).map(s=>s.code); const HIGHSET=shuffled.slice(15,28).map(s=>s.code);
['2330','2379'].forEach(c=>{const hi=HIGHSET.indexOf(c);if(hi>=0)HIGHSET.splice(hi,1);if(!LOWSET.includes(c))LOWSET.push(c)});
const TARGET={}; POOL.forEach(s=>TARGET[s.code]='none'); LOWSET.forEach(c=>TARGET[c]='low'); HIGHSET.forEach(c=>TARGET[c]='high');
TARGET['2618']='low'; TARGET['2412']='low'; TARGET['1519']='high'; TARGET['2886']='none'; TARGET['2449']='none';

// 價格序列(含 5 天未來不顯示;今天 = 最後一根)
const N=70;
function series(code){
  const r=rng(hash(code)); const t=TARGET[code]||'none'; const lowvol=BY[code]?.type==='lowvol';
  let p=20+r()*900; if(code==='2330')p=1180; if(code==='2379')p=468; if(code==='2412')p=129;
  const vol=lowvol?0.004:0.018+r()*0.012; const out=[];
  for(let i=0;i<N;i++){
    let drift=(Math.sin(i/9+hash(code)%7)*0.35+(r()-.5)*0.9)*vol;
    if(i>=N-4){drift=t==='low'?-vol*1.1:t==='high'?vol*1.1:0}
    const o=p*(1+(r()-.5)*vol*0.6); const c=p*(1+drift+(r()-.5)*vol*1.2);
    const h=Math.max(o,c)*(1+r()*vol*0.5); const l=Math.min(o,c)*(1-r()*vol*0.5);
    out.push({o,h,l,c,v:(0.6+r())*(lowvol?8000:20000)}); p=c;
  }
  const d0=new Date('2026-11-02'); let k=N-1; const days=[];
  for(let d=new Date(d0);k>=0;d.setDate(d.getDate()-1)){if(d.getDay()%6===0)continue;days[k--]=d.toISOString().slice(5,10).replace('-','/')}
  out.forEach((b,i)=>b.date=days[i]);
  // 過去訊號:規則候選(6 天最高/最低),隨機保留 → 判斷;真答案用 11 天視窗
  const cl=out.map(b=>b.c);
  out.forEach((b,i)=>{
    if(i<5){b.pred='none';return}
    const w=cl.slice(i-5,i+1); let pr='none';
    if(b.c===Math.max(...w))pr='high'; else if(b.c===Math.min(...w))pr='low';
    if(i+5<N){const w2=cl.slice(i-5,i+6);b.truth=b.c===Math.max(...w2)?'high':b.c===Math.min(...w2)?'low':'none';
      b.ret=(cl[i+5]/out[i+1].o-1)*100-0.585}
    else b.truth=null;
    if(pr!=='none'&&r()>(b.truth===pr?0.85:b.truth==null?0.5:0.3))pr='none';
    b.pred=pr; b.score=pr==='none'?0:0.25+r()*0.7;
  });
  const L=out[N-1]; L.score=scoreOf(code,'主軸'); if(t!=='none'&&BY[code]?.type!=='nosup'){L.pred=t}else if(L.pred!=='none'&&t==='none'){L.pred='none'}
  return out;
}
const S={}; function ser(c){return S[c]||(S[c]=series(c))}

function scoreOf(code,m){const r=rng(hash(code+m)); return 0.35+r()*0.6}
function level(s){return s>=0.72?'高':s>=0.5?'中':'低'}
const HIT={'主軸':{low:{高:34,中:29,低:24},high:{高:32,中:27,低:23}},'Stacking':{low:{高:33,中:28,低:22},high:{高:31,中:26,低:21}}};
// Stacking 判斷:主軸判斷的子集
function stackPred(code){const t=TARGET[code]; if(t==='none')return 'none'; return (hash(code+'s')%10)<5?t:'none'}
function predOf(code,m){return m==='主軸'?TARGET[code]||'none':stackPred(code)}
function listFor(m,kind){return POOL.filter(s=>predOf(s.code,m)===kind).map(s=>({...s,score:scoreOf(s.code,m)})).sort((a,b)=>b.score-a.score)}
const LBL={low:'低點',high:'高點',none:'非極值'};
const fmt=(x,d=2)=>x.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
function chgOf(code){const s=ser(code);const a=s[N-1].c,b=s[N-2].c;return (a/b-1)*100}

/* ---------- 小元件 ---------- */
function spark(code,w=86,h=28){const s=ser(code).slice(-20).map(b=>b.c);const mn=Math.min(...s),mx=Math.max(...s);
  const pts=s.map((v,i)=>`${(i/(s.length-1)*w).toFixed(1)},${(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`).join(' ');
  const up=s[s.length-1]>=s[0];return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--down)'}" stroke-width="1.6"/></svg>`}
function tagCls(k){return k==='low'?'t-low':k==='high'?'t-high':'t-none'}
function chgHtml(c){const v=chgOf(c);return `<span class="chg ${v>=0?'up':'dn'}">${v>=0?'▲':'▼'}${fmt(Math.abs(v))}%</span>`}

/* ---------- 頁面:今日判斷 ---------- */
let METHOD='主軸';
function pickRow(s,i,kind){const lv=level(s.score);const both=predOf(s.code,'主軸')===kind&&predOf(s.code,'Stacking')===kind;
  const color=kind==='low'?'var(--low)':'var(--high)';const last=ser(s.code)[N-1];
  return `<div class="pick" onclick="go('stock/${s.code}')"><div class="rank">${i+1}</div>
  <div><div class="nm">${s.code}<span>${s.name}</span> ${both?'<span class="tag t-both">兩方法一致</span>':''}</div>
  <div class="info">分數 ${fmt(s.score)} ・ 信心 <b>${lv}</b> ・ 同等級歷史命中 <b>${HIT[METHOD][kind][lv]}%</b></div>
  <div class="bar"><i style="width:${s.score*100}%;background:${color}"></i></div></div>
  <div class="right"><div class="px">${fmt(last.c)}</div>${chgHtml(s.code)}<div class="hide-m">${spark(s.code)}</div></div></div>`}
function listCard(kind){const L=listFor(METHOD,kind);const top=L.slice(0,3),rest=L.slice(3);
  const isLow=kind==='low';
  return `<div class="card"><div class="listhead"><span class="dot" style="background:${isLow?'var(--low)':'var(--high)'}"></span>
  <h2 style="margin:0">${isLow?'判低點':'判高點'} 前 3 檔</h2><span class="lbl">今天共 ${L.length} 檔,依分數排序</span></div>
  <div class="lbl" style="margin:-4px 0 6px">${isLow?'今天收盤可能是前後 11 天最低':'今天收盤可能是前後 11 天最高 ── 提醒用,沒有回測過賣出規則'}</div>
  ${top.map((s,i)=>pickRow(s,i,kind)).join('')}
  <details class="more"><summary>還有 ${rest.length} 檔也${isLow?'判低點':'判高點'}(分數較低)</summary>
  <table class="minitable"><tr><th>代號</th><th>名稱</th><th>收盤</th><th>分數</th><th>信心</th></tr>
  ${rest.map(s=>`<tr onclick="go('stock/${s.code}')" style="cursor:pointer"><td>${s.code}</td><td>${s.name}</td><td>${fmt(ser(s.code)[N-1].c)}</td><td>${fmt(s.score)}</td><td>${level(s.score)}</td></tr>`).join('')}</table></details></div>`}
function pageToday(){
  const lo=listFor(METHOD,'low'),hi=listFor(METHOD,'high');
  const both=POOL.filter(s=>predOf(s.code,'主軸')!=='none'&&predOf(s.code,'主軸')===predOf(s.code,'Stacking')).length;
  return `<div class="row" style="margin-bottom:14px"><div><h1>今日判斷 <span class="sample">示意資料</span></h1>

function kchart(code){
  const M=innerWidth<760;const NB=M?30:60;const s=ser(code).slice(-NB);const W=M?420:860,H=M?320:300,VH=50,pad=8,top=22,bot=H-VH-24;
  const mx=Math.max(...s.map(b=>b.h))*1.015,mn=Math.min(...s.map(b=>b.l))*0.985;const y=v=>top+(mx-v)/(mx-mn)*(bot-top);
  const bw=(W-pad*2)/s.length;const vmax=Math.max(...s.map(b=>b.v));let g='';
  for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3;g+=`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="2" y="${y(v)-3}" font-size="10" fill="#8a929c">${fmt(v,1)}</text>`}
  s.forEach((b,i)=>{const x=pad+i*bw+bw/2;const up=b.c>=b.o;const col=up?'var(--up)':'var(--down)';
    g+=`<line x1="${x}" x2="${x}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${col}"/>`;
    g+=`<rect x="${x-bw*0.34}" y="${y(Math.max(b.o,b.c))}" width="${bw*0.68}" height="${Math.max(1,Math.abs(y(b.o)-y(b.c)))}" fill="${col}"/>`;
    g+=`<rect x="${x-bw*0.34}" y="${H-24-b.v/vmax*VH}" width="${bw*0.68}" height="${b.v/vmax*VH}" fill="${col}" opacity=".35"/>`;
    if(b.pred&&b.pred!=='none'){const isL=b.pred==='low';const col2=isL?'var(--low)':'var(--high)';const yy=isL?y(b.l)+11:y(b.h)-11;
      const st=b.truth==null?'wait':b.truth===b.pred?'ok':'bad';const today=i===s.length-1;
      const tri=isL?`M${x-5},${yy+4} L${x+5},${yy+4} L${x},${yy-4} Z`:`M${x-5},${yy-4} L${x+5},${yy-4} L${x},${yy+4} Z`;
      g+=`<path d="${tri}" fill="${st==='ok'?col2:'#fff'}" stroke="${col2}" stroke-width="1.5" ${st==='wait'?'stroke-dasharray="2 1.5"':''}/>`;
      if(st==='bad')g+=`<text x="${x}" y="${isL?yy+16:yy-8}" font-size="9" fill="var(--bad)" text-anchor="middle">✕</text>`;
      if(today)g+=`<rect x="${x-bw/2}" y="${top-6}" width="${bw}" height="${bot-top+12}" fill="${col2}" opacity=".08"/><text x="${x-bw}" y="${top-9}" font-size="10" font-weight="700" fill="${col2}" text-anchor="end">今天 ▸</text>`}});

  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg></div>
  <div class="legend"><span><svg width="12" height="10"><path d="M1,9 L11,9 L6,1Z" fill="var(--low)"/></svg>判低點・對</span><span><svg width="12" height="10"><path d="M1,9 L11,9 L6,1Z" fill="#fff" stroke="var(--low)" stroke-width="1.4"/></svg>判低點・錯(✕)</span>
  <span><svg width="12" height="10"><path d="M1,1 L11,1 L6,9Z" fill="var(--high)"/></svg>判高點・對</span><span><svg width="12" height="10"><path d="M1,1 L11,1 L6,9Z" fill="#fff" stroke="var(--high)" stroke-width="1.4" stroke-dasharray="2 1.5"/></svg>虛線 = 待驗證(未滿 5 天)</span>
  <span>K 線為還原價,紅漲綠跌 ・ 主軸方法</span></div>`}

function pageAbout(){

  return `<h1>方法與說明</h1><p class="sub">本頁的命中率與回測數字是<b>研究結果(實際數字)</b>,來自 method_kline_peak 的 walk-forward 測試。</p>
  <div class="stack">
  <div class="card"><h2>「高點」「低點」是什麼意思</h2>
   <div class="grid2"><div><div class="label-demo">${bars}</div><div class="legend"><span>t−5 … t−1</span><span style="color:var(--low);font-weight:700">t(今天)</span><span>t+1 … t+5(要等 5 天)</span></div></div>
   <div style="font-size:14px">看 11 天:今天(第 6 天)加前後各 5 天。<br>・今天收盤是 11 天<b>最低</b> → 低點<br>・今天收盤是 11 天<b>最高</b> → 高點<br>・其他 → 非極值(約 85% 的日子)<br><br>
   模型只看今天和前 5 天的 6 根 K 線,所以收盤後就能判斷;但真正的答案要等 5 個交易日後才知道。</div></div></div>
  <div class="card"><h2>兩個方法</h2><div class="steps">
   <div class="step"><b>1. 規則挑候選</b>今天收盤是近 6 天最高 → 高點候選;最低 → 低點候選。其他直接判非極值。</div>
   <div class="step"><b>2a. ① 主軸</b>候選點再經過 AE + OC-SVM 檢查,形狀像過去的真高/低點才保留。分數 = decision_function。</div>
   <div class="step"><b>2b. ② Stacking</b>把兩個 AE / OC-SVM 的分數交給邏輯迴歸,輸出機率。判得比較少。</div></div>
   <div class="lbl" style="margin-top:8px">特徵:6 根 K 線的開高低收 ÷ 今天收盤、量 ÷ 10 日均量,共 29 個數字。每年 1 月用前 4 年資料重訓,種子 42。</div></div>

   <tr><td>② Stacking</td><td>2024</td><td>50.18%</td><td>25.9%</td><td>26.4%</td><td>54.3%</td><td>40.7%</td></tr>
   <tr><td>② Stacking</td><td>2025</td><td>49.87%</td><td>27.2%</td><td>26.5%</td><td>42.9%</td><td>39.0%</td></tr>
   <tr><td>② Stacking</td><td>2026(1–9 月)</td><td>50.15%</td><td>29.8%</td><td>22.4%</td><td>50.2%</td><td>45.3%</td></tr></table></div>
   <div class="lbl" style="margin-top:6px">隨便挑一天剛好是 11 天最低點的機率約 7%。兩個方法都沒有把高點判成低點(或反過來),錯的都是和非極值混淆。</div></div>
  <div class="card"><h2>回測摘要(研究結果,扣成本 0.585%)</h2>
   <div class="lbl" style="margin-bottom:6px">規則:只做多、判低點分數前 3 檔、每檔 1/3 資金、t+1 開盤買、t+5 收盤賣、每年獨立 100 萬。</div>
   <div class="tblwrap"><table class="tbl"><tr><th>股票池</th><th>方法</th><th>2024</th><th>2025</th><th>2026(1–9 月)</th></tr>
   <tr><td>TW100 73 檔</td><td>① 主軸</td><td class="up">+11.69%</td><td class="dn">−42.17%</td><td class="up">+8.69%</td></tr>
   <tr><td>TW100 73 檔</td><td>② Stacking</td><td class="dn">−12.81%</td><td class="dn">−7.06%</td><td class="up">+37.78%</td></tr>
